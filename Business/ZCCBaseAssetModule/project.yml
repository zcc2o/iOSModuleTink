name: ZCCBaseAssetModule
options:
  bundleIdPrefix: com.zcc.business
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ZCCBaseAssetModule:
    type: framework
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zcc.ZCCBaseAssetModule
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "NO"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../../Foundation/ZCCLogComponent/Binary"
          - "$(SRCROOT)/../../Foundation/ZCCUIComponent/Binary"
          - "$(SRCROOT)/../../Foundation/ZCCWebComponent/Binary"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/.hdrmap"
    sources:
      - path: Classes
        type: group
